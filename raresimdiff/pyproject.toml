[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raresimdiff"
version = "0.1.0"
description = "Physics-grounded diffusion scenario generator for humanoid robot learning (research MVP)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0",
  "torch>=2.2",
  "mujoco>=3.1",
  "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
package = ["zstandard>=0.22"]
tensorboard = ["tensorboard"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: slower tests"]
