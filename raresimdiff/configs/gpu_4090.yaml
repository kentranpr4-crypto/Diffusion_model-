# Frozen configuration for the single official GPU run (RTX 4090 24 GB).
# Throughput / memory numbers in docs are ESTIMATES until the GPU preflight probe reports real values.
run:
  name: official
  seed: 1234
  deterministic: true
training:
  batch_size: 512            # per optimizer micro-batch
  grad_accum_steps: 2        # effective batch = 1024
  max_steps: 30000
  lr: 3.0e-4
  min_lr_ratio: 0.05
  warmup_steps: 1000
  weight_decay: 0.01
  adam_betas: [0.9, 0.99]
  grad_clip: 1.0
  ema_decay: 0.9995
  amp_dtype: bfloat16        # used only if the GPU supports bf16; otherwise float32
  log_every: 100
  eval_every: 1000
  ckpt_every: 2000
  keep_last_checkpoints: 3
  max_consecutive_nonfinite: 20
  val_max_samples: 8192
gpu:
  min_vram_gb: 16
  expected_gpu_name_contains: "4090"   # warning only
  min_free_disk_gb: 5
evaluation:
  n_per_condition: 200
  severities: [0.2, 0.5, 0.8, 0.95]
  events: [object_slip, moving_obstacle, perception_degradation, slip_and_perception]
  ddim_steps: 50
  cfg_scale: 1.5
  simulate: true
  baseline_policy: scripted_baseline
